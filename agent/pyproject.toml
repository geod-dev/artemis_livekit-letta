[project]
name = "voice-agent"
version = "0.1.0"
description = "LiveKit voice front-end for the Letta-backed personal assistant"
requires-python = ">=3.11, <3.15"
dependencies = [
    "livekit-agents[openai,deepgram,cartesia,elevenlabs]~=1.8.4",
    "livekit-plugins-telnyx~=1.8.4",
    "python-dotenv>=1.0",
]

[project.scripts]
agent = "voice_agent.main:run"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6", "pyright>=1.1.390"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voice_agent"]

[tool.uv]
# yarl 1.24.1 shipped only a cp310 wheel (see livekit agent-starter-python).
constraint-dependencies = ["yarl<1.24"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.13"
venvPath = "."
venv = ".venv"
