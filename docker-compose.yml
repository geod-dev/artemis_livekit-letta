# The full application stack. Host-facing URLs use IP_ADDRESS; containers use
# Compose service names for traffic that stays inside the Docker network.
name: livekit-letta

services:
  letta:
    image: livekit-letta/letta:0.34.4-groq-qwen
    build:
      context: ./infrastructure/letta
    # Native providers are enabled by their API key env vars. An optional
    # OpenAI-compatible endpoint is registered at startup, through the proxy
    # below. infrastructure/letta/agent-setup.mjs installs the assistant's
    # subagents and removes per-agent MCP server entries.
    # Non-loopback listeners require auth: the shared token is written to a file
    # for capability-token auth. All state (agents, conversations, MemFS memory)
    # lives in /root/.letta.
    command: ["sh", "/opt/assistant/entrypoint.sh"]
    environment:
      LETTA_SERVER_TOKEN: ${LETTA_SERVER_TOKEN:?set LETTA_SERVER_TOKEN in .env}
      LETTA_SKIP_KEYCHAIN_CHECK: "1"
      # This image and its compatibility patch pin Letta to 0.34.4.
      DISABLE_AUTOUPDATER: "1"
      CEREBRAS_API_KEY: ${CEREBRAS_API_KEY:-}
      ZAI_API_KEY: ${ZAI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      OPENAI_COMPATIBLE_BASE_URL: ${OPENAI_COMPATIBLE_BASE_URL:-}
      OPENAI_COMPATIBLE_API_KEY: ${OPENAI_COMPATIBLE_API_KEY:-}
      OPENAI_COMPATIBLE_PROXY_URL: http://openai-compatible-proxy:8080/v1
      # Background workers: their model.
      ASSISTANT_TASK_MODEL: ${ASSISTANT_TASK_MODEL:-}
      # Defaults to the backend service in the full stack. Host-based development
      # can override this with host.docker.internal:3000.
      ASSISTANT_GATEWAY_URL: ${ASSISTANT_GATEWAY_URL:-http://backend:3000}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      openai-compatible-proxy:
        condition: service_healthy
    volumes:
      - letta-data:/root/.letta
      # The agent's workspace (its working directory), shared with the backend.
      # data/ holds the backend's files (attachments, state): read-only here.
      - ${WORKSPACE_PATH:-./backend/.workspace}:/workspace
      - ${ASSISTANT_DATA_ROOT:-./backend/.workspace/data}:/workspace/data:ro
      - ./infrastructure/letta/extensions/telnyx.mjs:/root/.letta/mods/telnyx.mjs:ro
      - ./infrastructure/letta/extensions/notifications.mjs:/root/.letta/mods/notifications.mjs:ro
      - ./infrastructure/letta/agent-setup.mjs:/opt/assistant/setup.mjs:ro
      - ./infrastructure/letta/agents:/opt/assistant/agents:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:4500/readyz"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # Letta always appends /v1 to an OpenAI-compatible base URL, for model
  # discovery and for completions. Endpoints that live elsewhere (Telnyx:
  # https://api.telnyx.com/v2/ai/openai) are served here as /v1/*.
  openai-compatible-proxy:
    image: nginx:1.27-alpine
    command: ["nginx", "-g", "daemon off;"]
    environment:
      OPENAI_COMPATIBLE_BASE_URL: ${OPENAI_COMPATIBLE_BASE_URL:-http://127.0.0.1:9}
    volumes:
      - ./infrastructure/openai-compatible-proxy/default.conf.template:/etc/nginx/templates/default.conf.template:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  livekit:
    image: livekit/livekit-server:v1.13.7
    # Production leaves signal routing to the reverse proxy and publishes media
    # only. A loopback signal port remains available for the standalone HTTPS host.
    command: --bind 0.0.0.0 --node-ip ${IP_ADDRESS:-127.0.0.1} --udp-port 7882
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:-devkey}: ${LIVEKIT_API_SECRET:-secret}"
    ports:
      - "${LIVEKIT_SIGNAL_BIND:-127.0.0.1}:7880:7880"
      - "7881:7881"
      - "7882:7882/udp"
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      BACKEND_PORT: 3000
      MCP_DEVICE_BASE_URL: http://backend:3000
      LETTA_URL: http://letta:4500
      LIVEKIT_URL: ${LIVEKIT_PUBLIC_URL:-ws://${IP_ADDRESS:-127.0.0.1}:7880}
      WORKSPACE_PATH: /workspace
      ASSISTANT_DATA_ROOT: /data/backend
    depends_on:
      letta:
        condition: service_healthy
    volumes:
      - ${WORKSPACE_PATH:-./backend/.workspace}:/workspace
      - ${ASSISTANT_DATA_ROOT:-./backend/.workspace/data}:/data/backend
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        IP_ADDRESS: ${IP_ADDRESS:-127.0.0.1}
        ASSISTANT_NAME: ${ASSISTANT_NAME:-Ada}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_BIND:-127.0.0.1}:${FRONTEND_PORT:-5180}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  voice-agent:
    build:
      context: .
      dockerfile: agent/Dockerfile
    env_file: .env
    environment:
      LIVEKIT_URL: ws://livekit:7880
      GATEWAY_URL: http://backend:3000
    depends_on:
      backend:
        condition: service_healthy
      livekit:
        condition: service_started
    restart: unless-stopped

volumes:
  letta-data:
    name: ${LETTA_DATA_VOLUME:-${COMPOSE_PROJECT_NAME:-livekit-letta}_letta-data}
    external: ${LETTA_DATA_EXTERNAL:-false}
