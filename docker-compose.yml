# The full application stack. Host-facing URLs use IP_ADDRESS; containers use
# Compose service names for traffic that stays inside the Docker network.
name: livekit-letta

services:
  letta:
    image: livekit-letta/letta:0.34.4-groq-qwen
    build:
      context: ./infrastructure/letta
    # Native providers are enabled by their API key env vars. An optional
    # OpenAI-compatible endpoint is registered at startup, through the proxy
    # below. letta/setup.mjs installs the assistant's subagents and MCP servers.
    # Non-loopback listeners require auth: the shared token is written to a file
    # for capability-token auth. All state (agents, conversations, MemFS memory)
    # lives in /root/.letta.
    command:
      - sh
      - -c
      - >-
        node /opt/assistant/setup.mjs || exit 1;
        if [ -n "$$OPENAI_COMPATIBLE_BASE_URL" ]; then
        letta --backend local connect openai-compatible
        --base-url http://openai-compatible-proxy:8080/v1 --api-key "$$OPENAI_COMPATIBLE_API_KEY" || exit 1;
        fi &&
        printf %s "$$LETTA_SERVER_TOKEN" > /run/letta-token &&
        exec letta --backend local server
        --listen ws://0.0.0.0:4500
        --ws-auth capability-token --ws-token-file /run/letta-token
    environment:
      LETTA_SERVER_TOKEN: ${LETTA_SERVER_TOKEN:?set LETTA_SERVER_TOKEN in .env}
      LETTA_SKIP_KEYCHAIN_CHECK: "1"
      # This image and its compatibility patch pin Letta to 0.34.4.
      DISABLE_AUTOUPDATER: "1"
      CEREBRAS_API_KEY: ${CEREBRAS_API_KEY:-}
      ZAI_API_KEY: ${ZAI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      OPENAI_COMPATIBLE_BASE_URL: ${OPENAI_COMPATIBLE_BASE_URL:-}
      OPENAI_COMPATIBLE_API_KEY: ${OPENAI_COMPATIBLE_API_KEY:-}
      OPENAI_COMPATIBLE_PROXY_URL: http://openai-compatible-proxy:8080/v1
      # Background workers: their model.
      ASSISTANT_TASK_MODEL: ${ASSISTANT_TASK_MODEL:-}
      # Defaults to the backend service in the full stack. Host-based development
      # can override this with host.docker.internal:3000.
      ASSISTANT_GATEWAY_URL: ${ASSISTANT_GATEWAY_URL:-http://backend:3000}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - openai-compatible-proxy
    volumes:
      - letta-data:/root/.letta
      # The agent's workspace (its working directory), shared with the backend.
      # data/ holds the backend's files (attachments, state): read-only here.
      - ${WORKSPACE_PATH:-./backend/.workspace}:/workspace
      - ${WORKSPACE_PATH:-./backend/.workspace}/data:/workspace/data:ro
      - ./letta/telnyx.mjs:/root/.letta/mods/telnyx.mjs:ro
      - ./letta/notifications.mjs:/root/.letta/mods/notifications.mjs:ro
      - ./letta/setup.mjs:/opt/assistant/setup.mjs:ro
      - ./letta/agents:/opt/assistant/agents:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:4500/readyz"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # Letta always appends /v1 to an OpenAI-compatible base URL, for model
  # discovery and for completions. Endpoints that live elsewhere (Telnyx:
  # https://api.telnyx.com/v2/ai/openai) are served here as /v1/*.
  openai-compatible-proxy:
    image: nginx:1.27-alpine
    command:
      - sh
      - -c
      - |
        upstream="$${OPENAI_COMPATIBLE_BASE_URL:-http://127.0.0.1:9}"
        upstream="$${upstream%/}"
        cat > /etc/nginx/conf.d/default.conf <<EOF
        server {
          listen 8080;
          location /v1/ {
            proxy_pass $$upstream/;
            proxy_ssl_server_name on;
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_read_timeout 600s;
          }
        }
        EOF
        exec nginx -g 'daemon off;'
    environment:
      OPENAI_COMPATIBLE_BASE_URL: ${OPENAI_COMPATIBLE_BASE_URL:-}
    restart: unless-stopped

  livekit:
    image: livekit/livekit-server:v1.13.7
    # Use configured API keys and a single UDP media port. Advertise the host
    # address so browsers on other devices can reach WebRTC media.
    command: --bind 0.0.0.0 --node-ip ${IP_ADDRESS:-127.0.0.1} --udp-port 7882
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:-devkey}: ${LIVEKIT_API_SECRET:-secret}"
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      BACKEND_PORT: 3000
      MCP_DEVICE_BASE_URL: http://backend:3000
      LETTA_URL: http://letta:4500
      LIVEKIT_URL: ${LIVEKIT_PUBLIC_URL:-ws://${IP_ADDRESS:-127.0.0.1}:7880}
    depends_on:
      letta:
        condition: service_healthy
    volumes:
      - ${WORKSPACE_PATH:-./backend/.workspace}:/app/.workspace
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        IP_ADDRESS: ${IP_ADDRESS:-127.0.0.1}
        ASSISTANT_NAME: ${ASSISTANT_NAME:-Ada}
    depends_on:
      - backend
    ports:
      - "${FRONTEND_BIND:-0.0.0.0}:${FRONTEND_PORT:-5173}:80"
    restart: unless-stopped

  voice-agent:
    build:
      context: .
      dockerfile: agent/Dockerfile
    env_file: .env
    environment:
      LIVEKIT_URL: ws://livekit:7880
      GATEWAY_URL: http://backend:3000
    depends_on:
      - backend
      - livekit
    restart: unless-stopped

volumes:
  letta-data:
    name: ${LETTA_DATA_VOLUME:-${COMPOSE_PROJECT_NAME:-livekit-letta}_letta-data}
    external: ${LETTA_DATA_EXTERNAL:-false}
