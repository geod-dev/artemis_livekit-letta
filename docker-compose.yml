# The full application stack. Host-facing URLs use IP_ADDRESS; containers use
# Compose service names for traffic that stays inside the Docker network.
#
# Environment rule, for every service: no service uses `env_file`. Each one lists in `environment:`
# exactly the variables its code reads, so a provider key reaches only the container that uses it.
# Compose reads .env only to interpolate ${VAR} in this file, so the file validates on a fresh clone.
# The `:?` variables below must still be set (in .env or the shell) before the stack starts.
#
# Networks: `edge` carries the browser path and the LiveKit media path. `data` is internal (no route
# out of the host) and carries Postgres, Hindsight and the agent server. `egress` is the only network
# with a route out, so Hindsight can call its LLM provider; no other service joins it.
name: artemis

services:
  postgres:
    # The init script is baked into the image (deploy/postgres/Dockerfile), as on Coolify.
    build:
      context: ./deploy/postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      ARTEMIS_DB_PASSWORD: ${ARTEMIS_DB_PASSWORD:?set ARTEMIS_DB_PASSWORD in .env}
      HINDSIGHT_DB_PASSWORD: ${HINDSIGHT_DB_PASSWORD:?set HINDSIGHT_DB_PASSWORD in .env}
    volumes:
      - postgres-pg18:/var/lib/postgresql   # PG18 image VOLUME is /var/lib/postgresql
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  hindsight:
    # Pinned by digest; the tag is in the comment. Needs `egress` to reach its LLM provider.
    image: ghcr.io/vectorize-io/hindsight@sha256:50311d02b4d5d2b7c5242bd336edf8735df8374eaad496a92f49c83b37d2aa06 # tag 1.1.0
    hostname: hindsight
    shm_size: 1g
    environment:
      HINDSIGHT_API_DATABASE_URL: postgresql://hindsight:${HINDSIGHT_DB_PASSWORD:?set HINDSIGHT_DB_PASSWORD in .env}@postgres:5432/hindsight
      HINDSIGHT_API_LLM_PROVIDER: anthropic
      HINDSIGHT_API_LLM_MODEL: ${HINDSIGHT_LLM_MODEL:-claude-haiku-5-5}
      HINDSIGHT_API_LLM_API_KEY: ${ANTHROPIC_API_KEY:?set ANTHROPIC_API_KEY in .env}
      HINDSIGHT_API_LLM_EXTRA_BODY: '{"output_config":{"effort":"medium"}}'
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - data
      - egress
    healthcheck:
      test: ["CMD", "python", "-c", "import sys,urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8888/health/ready', timeout=3).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    restart: unless-stopped

  agent-server:
    build:
      context: .
      dockerfile: apps/agent-server/Dockerfile
    # Starts as root only so that docker-entrypoint.sh can run the server as uid 1001 and keep SETUID and
    # SETGID for the server's launches of agent shells (uid 1002). Each shell has both cleared before it runs
    # (packages/workspace process.ts). Do not add `user:`. Those two capabilities are the only ones granted.
    init: true
    cap_drop: [ALL]
    cap_add: [SETUID, SETGID]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 512
    mem_limit: 4g
    # Explicit list, not env_file: the server gets only the variables it reads (apps/agent-server/src/config.ts).
    # Agent shell commands run as uid 1002 with no capabilities (the workspace runner clears them), so they
    # cannot switch back to uid 1001 to read this process's environment.
    environment:
      NODE_ENV: production
      AGENT_SERVER_PORT: 4000
      AGENT_SERVER_TOKEN: ${AGENT_SERVER_TOKEN:?set AGENT_SERVER_TOKEN in .env}
      DATABASE_URL: postgresql://artemis:${ARTEMIS_DB_PASSWORD:?set ARTEMIS_DB_PASSWORD in .env}@postgres:5432/artemis
      ARTEMIS_DB_PASSWORD: ${ARTEMIS_DB_PASSWORD:?set ARTEMIS_DB_PASSWORD in .env}
      HINDSIGHT_DB_PASSWORD: ${HINDSIGHT_DB_PASSWORD:?set HINDSIGHT_DB_PASSWORD in .env}
      # Literal on purpose: containers always use the in-network Hindsight service. HINDSIGHT_URL
      # in .env is for host runs and must not leak into the containers through interpolation.
      HINDSIGHT_URL: http://hindsight:8888
      # Required. Agent shells share the data network with Hindsight, so the key must be set.
      HINDSIGHT_API_KEY: ${HINDSIGHT_API_KEY:?set HINDSIGHT_API_KEY in .env}
      HINDSIGHT_BANK_ID: ${HINDSIGHT_BANK_ID:-}
      MEMORY_RETAIN_EVERY: ${MEMORY_RETAIN_EVERY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?set ANTHROPIC_API_KEY in .env}
      OPENAI_COMPATIBLE_BASE_URL: ${OPENAI_COMPATIBLE_BASE_URL:-}
      OPENAI_COMPATIBLE_API_KEY: ${OPENAI_COMPATIBLE_API_KEY:-}
      ASSISTANT_NAME: ${ASSISTANT_NAME:-}
      ASSISTANT_TIMEZONE: ${ASSISTANT_TIMEZONE:-}
      ASSISTANT_MODEL: ${ASSISTANT_MODEL:-}
      ASSISTANT_TASK_MODEL: ${ASSISTANT_TASK_MODEL:-}
      ASSISTANT_TITLE_MODEL: ${ASSISTANT_TITLE_MODEL:-}
      ASSISTANT_PRESENT_TOOL: ${ASSISTANT_PRESENT_TOOL:-}
      WORKER_IDLE_TIMEOUT_MS: ${WORKER_IDLE_TIMEOUT_MS:-}
      BASH_BACKGROUND_AFTER_MS: ${BASH_BACKGROUND_AFTER_MS:-}
      LOG_LEVEL: ${LOG_LEVEL:-}
      WORKSPACE_PATH: /workspace
      # Agent shell commands: uid 1002, sharing the server's group 1001 (see apps/agent-server/Dockerfile).
      WORKSPACE_RUN_AS: "1002:1001"
    depends_on:
      postgres:
        condition: service_healthy
      hindsight:
        condition: service_healthy
    volumes:
      # The workspace holds the agent's files. data/ is mounted again below, so it is a mount point that
      # the agent cannot rename or remove. data/ must be owned by uid 1001 with mode 0755 on the host
      # (deploy/coolify/README.md).
      - ${WORKSPACE_PATH:-./data/workspace}:/workspace
      - ${WORKSPACE_PATH:-./data/workspace}/data:/workspace/data
    networks:
      - edge
      - data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  livekit:
    # Pinned by digest; the tag is in the comment.
    image: livekit/livekit-server@sha256:6fd3b7088874c4d119160dd688798dfec852bc014786d392caad15f6f63912a3 # tag v1.13.7
    # Production leaves signal routing to the reverse proxy and publishes media
    # only. A loopback signal port remains available for the standalone HTTPS host.
    command: --bind 0.0.0.0 --node-ip ${IP_ADDRESS:?set IP_ADDRESS in .env} --udp-port 7882
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:?set LIVEKIT_API_KEY in .env}: ${LIVEKIT_API_SECRET:?set LIVEKIT_API_SECRET in .env}"
    ports:
      - "${LIVEKIT_SIGNAL_BIND:-127.0.0.1}:7880:7880"
      # WebRTC media: 7881/tcp and 7882/udp are published on all interfaces on purpose.
      - "7881:7881"
      - "7882:7882/udp"
    networks:
      - edge
    restart: unless-stopped

  gateway:
    build:
      context: .
      dockerfile: apps/gateway/Dockerfile
    # Explicit list, not env_file: the gateway is the public-facing service and gets only the
    # variables it reads (apps/gateway/src/config.ts). Provider keys stay out of its environment.
    environment:
      NODE_ENV: production
      GATEWAY_PORT: 3000
      # The gateway binds all container interfaces; it is reached only through the web service.
      GATEWAY_HOST: 0.0.0.0
      MCP_DEVICE_BASE_URL: http://gateway:3000
      AGENT_SERVER_URL: http://agent-server:4000
      AGENT_SERVER_TOKEN: ${AGENT_SERVER_TOKEN:?set AGENT_SERVER_TOKEN in .env}
      ARTEMIS_PASSWORD: ${ARTEMIS_PASSWORD:?set ARTEMIS_PASSWORD in .env}
      ARTEMIS_DEVICE_TOKEN: ${ARTEMIS_DEVICE_TOKEN:?set ARTEMIS_DEVICE_TOKEN in .env}
      VOICE_GATEWAY_TOKEN: ${VOICE_GATEWAY_TOKEN:?set VOICE_GATEWAY_TOKEN in .env}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:?set LIVEKIT_API_KEY in .env}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?set LIVEKIT_API_SECRET in .env}
      LIVEKIT_AGENT_NAME: ${LIVEKIT_AGENT_NAME:-}
      # Browsers reach LiveKit through the web proxy (/livekit/) on the same host and port.
      LIVEKIT_URL: ${LIVEKIT_PUBLIC_URL:-ws://${IP_ADDRESS:?set IP_ADDRESS in .env}:${WEB_PORT:-5180}/livekit}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      ASSISTANT_TRANSCRIPTION_MODEL: ${ASSISTANT_TRANSCRIPTION_MODEL:-}
      WORKSPACE_PATH: /workspace
      ARTEMIS_DATA_DIR: /data/gateway
    depends_on:
      agent-server:
        condition: service_healthy
    volumes:
      - ${WORKSPACE_PATH:-./data/workspace}:/workspace
      # Gateway state only (attachment and retention records). Not visible to the agent.
      - ${ARTEMIS_DATA_DIR:-./data/gateway}:/data/gateway
    networks:
      - edge
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Empty means the default in apps/web/vite.config.ts.
        ASSISTANT_NAME: ${ASSISTANT_NAME:-}
    depends_on:
      gateway:
        condition: service_healthy
      # nginx resolves livekit when it proxies /livekit/; the dependency keeps the start order explicit.
      livekit:
        condition: service_started
    ports:
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-5180}:8080"
    networks:
      - edge
    healthcheck:
      # Local nginx check only: /health proxies to the gateway, so it would mark web unhealthy when the gateway is down.
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/nginx-health"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  voice-agent:
    build:
      context: .
      dockerfile: apps/voice-agent/Dockerfile
    # Explicit list, not env_file. It is the set of variables apps/voice-agent reads
    # (src/voice_agent/config.py, plus the LiveKit SDK's LIVEKIT_URL, LIVEKIT_API_KEY and LIVEKIT_API_SECRET).
    # The defaults after `:-` match config.py. Empty values are not passed for the VOICE_* and GROQ_BASE_URL
    # settings, because config.py reads an empty string as a value, not as unset.
    environment:
      VOICE_GATEWAY_TOKEN: ${VOICE_GATEWAY_TOKEN:?set VOICE_GATEWAY_TOKEN in .env}
      GATEWAY_URL: http://gateway:3000
      LIVEKIT_URL: ws://livekit:7880
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:?set LIVEKIT_API_KEY in .env}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?set LIVEKIT_API_SECRET in .env}
      LIVEKIT_AGENT_NAME: ${LIVEKIT_AGENT_NAME:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_BASE_URL: ${GROQ_BASE_URL:-https://api.groq.com/openai/v1}
      DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY:-}
      VOICE_STT: ${VOICE_STT:-groq/whisper-large-v3-turbo}
      VOICE_TTS: ${VOICE_TTS:-deepgram/flux-hannah-en}
      VOICE_LANGUAGE: ${VOICE_LANGUAGE:-en}
      VOICE_GREETING: "${VOICE_GREETING:-Hi, I'm listening.}"
    depends_on:
      gateway:
        condition: service_healthy
      livekit:
        condition: service_started
    networks:
      - edge
    restart: unless-stopped

networks:
  edge:
    # Pinned subnet: apps/web/nginx.conf trusts this range (and loopback) for X-Forwarded-For.
    # Keep the two in sync. Also set in docker-compose.coolify.yml, where the Coolify proxy must join this network.
    ipam:
      config:
        - subnet: 172.29.250.0/24
  data:
    # Internal: no route out of the host. Postgres and Hindsight are reachable only from here.
    # docker-compose.dev.yml lifts internal for host-run development so the published ports work.
    internal: true
    ipam:
      config:
        - subnet: 172.29.251.0/24
  egress:
    # Routed network for Hindsight's outbound calls. Only Hindsight joins it.

volumes:
  # Same name as docker-compose.coolify.yml, so both stacks use one volume. A volume initialized without
  # the init script (no artemis or hindsight roles) must not be reused; give it a new name instead.
  postgres-pg18:
