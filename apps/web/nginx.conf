# Serves the built web app and proxies /health, /api and /livekit/ to the internal services.
# The container runs as a non-root user (nginx-unprivileged) and listens on 8080.

# X-Forwarded-Proto is client-controlled unless an edge sets it. Accept only the two schemes;
# anything else falls back to the scheme this server received.
map $http_x_forwarded_proto $forwarded_proto {
  https https;
  http  http;
  default $scheme;
}

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  server_tokens off;

  # This server sits behind the HTTPS edge (deploy/https) on the Docker network or loopback.
  # Forwarding headers from those private networks are believed; $remote_addr becomes the
  # client address. A direct LAN client can still set the header, which is why the login
  # limiter in the gateway also has a global ceiling.
  set_real_ip_from 127.0.0.0/8;
  set_real_ip_from 10.0.0.0/8;
  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from 192.168.0.0/16;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; media-src 'self' blob:; font-src 'self' data:; connect-src 'self' ws: wss:; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  location /internal/ {
    return 404;
  }

  location = /health {
    proxy_pass http://gateway:3000/health;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
  }

  # LiveKit Twirp admin API (RoomService, Egress, ...) stays internal. Must precede /livekit/.
  location ^~ /livekit/twirp {
    return 404;
  }

  # Client signaling (/livekit/rtc) and media go through this proxy.
  location /livekit/ {
    proxy_pass http://livekit:7880/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
  }

  location /api {
    proxy_pass http://gateway:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    # Matches the gateway's attachment limit (25 MB); nginx's default is 1 MB.
    client_max_body_size 25m;
    proxy_buffering off;
    proxy_read_timeout 3600s;
  }

  # Vite emits content-hashed file names under assets/, so they can be cached for a year.
  location /assets/ {
    expires 1y;
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
