# Serves the built web app and proxies /health, /api and /livekit/ to the internal services.
# The container runs as a non-root user (nginx-unprivileged) and listens on 8080.

# X-Forwarded-Proto is client-controlled unless an edge sets it. Accept only the two schemes;
# anything else falls back to the scheme this server received.
map $http_x_forwarded_proto $forwarded_proto {
  https https;
  http  http;
  default $scheme;
}

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  server_tokens off;

  # Upstreams are variables, so nginx resolves them through Docker's DNS when a request arrives. A
  # recreated gateway or livekit container is then found again, instead of the IP resolved at startup.
  resolver 127.0.0.11 valid=10s;
  set $gateway_upstream http://gateway:3000;
  set $livekit_upstream http://livekit:7880;

  # This server sits behind the HTTPS edge (deploy/https) on loopback or the pinned Compose subnet
  # (docker-compose*.yml, 172.29.250.0/24). Only those peers may set X-Forwarded-For; $remote_addr
  # then becomes the client address. Other RFC 1918 ranges are not trusted. A direct client on the
  # LAN can still reach the port, which is why the gateway's login limiter also has a global ceiling.
  set_real_ip_from 127.0.0.0/8;
  set_real_ip_from 172.29.250.0/24;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  # img-src https: is deliberate: link previews and cited sources load images from any site.
  # connect-src ws: wss: stays broad because LIVEKIT_PUBLIC_URL may name another host.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; media-src 'self' blob:; font-src 'self' data:; connect-src 'self' ws: wss:; worker-src 'self' blob:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  location /internal/ {
    return 404;
  }

  # Local liveness for the container healthcheck. It does not depend on the gateway.
  location = /nginx-health {
    access_log off;
    return 200;
  }

  # $http_host keeps the port the browser sent. The gateway's Origin check compares against Host,
  # and browsers send Origin with the port (for example http://127.0.0.1:5180).
  location = /health {
    proxy_pass $gateway_upstream;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
  }

  # LiveKit Twirp admin API (RoomService, Egress, ...) stays internal. Must precede /livekit/.
  location ^~ /livekit/twirp {
    return 404;
  }

  # Client signaling (/livekit/rtc) and media go through this proxy. The rewrite strips the
  # /livekit prefix, as the former `proxy_pass http://livekit:7880/;` did.
  location /livekit/ {
    rewrite ^/livekit/(.*)$ /$1 break;
    proxy_pass $livekit_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
  }

  # The gateway's API: /api and /api/... only, so /apiary is not proxied.
  location ~ ^/api(/|$) {
    proxy_pass $gateway_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    # Matches the gateway's attachment limit (25 MB); nginx's default is 1 MB.
    client_max_body_size 25m;
    proxy_buffering off;
    proxy_read_timeout 3600s;
  }

  # Vite emits content-hashed file names under assets/, so they can be cached for a year.
  location /assets/ {
    expires 1y;
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
