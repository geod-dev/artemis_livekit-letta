[project]
name = "voice-agent"
version = "0.1.0"
description = "LiveKit voice front-end for the personal assistant"
requires-python = ">=3.13"
dependencies = [
    "aiohttp>=3.9",
    "livekit-agents[openai,deepgram]~=1.8.4",
    "python-dotenv>=1.0",
]

[project.scripts]
voice-agent = "voice_agent.main:run"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6", "pyright>=1.1.390"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voice_agent"]

[tool.uv]
# Keep yarl below 1.24. Reason: yarl 1.24.1 shipped only a cp310 wheel (see livekit
# agent-starter-python). Remove this pin when a yarl release ships a cp313 wheel: drop the
# constraint, run `uv lock`, and confirm `uv sync` on Python 3.13 still installs.
constraint-dependencies = ["yarl<1.24"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.13"
venvPath = "."
venv = ".venv"
