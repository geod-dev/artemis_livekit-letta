plugins { id 'com.android.application' }

// Signing: when .signing/debug.keystore exists, the debug and release builds are signed with it.
// Its store password, key alias and key password come from local.properties, then the
// environment, and the build stops when one is missing. Without that key, both build types use
// AGP's default debug key.
def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) localPropertiesFile.withInputStream { localProperties.load(it) }
def personalKey = rootProject.file('.signing/debug.keystore')
def signingValue = { String property, String variable ->
    def value = localProperties.getProperty(property) ?: System.getenv(variable)
    if (!value) {
        throw new org.gradle.api.GradleException(
            "Set $property in local.properties or $variable in the environment to sign with .signing/debug.keystore.")
    }
    return value
}

android {
    namespace 'ai.artemis.mobile'
    compileSdk 36
    signingConfigs {
        if (personalKey.exists()) {
            debug {
                storeFile personalKey
                storePassword signingValue('artemis.debugStorePassword', 'ARTEMIS_DEBUG_STORE_PASSWORD')
                keyAlias signingValue('artemis.debugKeyAlias', 'ARTEMIS_DEBUG_KEY_ALIAS')
                keyPassword signingValue('artemis.debugKeyPassword', 'ARTEMIS_DEBUG_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        // Not debuggable, so adb run-as cannot read app data (including WebView session cookies).
        release {
            debuggable false
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }
    defaultConfig {
        applicationId 'ai.artemis.mobile'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '1.0'
    }
    def configuredHomeUrl = providers.gradleProperty('artemisMobileUrl')
        .orElse(providers.environmentVariable('ARTEMIS_MOBILE_URL')).getOrNull()?.trim()
    if (!configuredHomeUrl) {
        throw new org.gradle.api.GradleException('Set -PartemisMobileUrl=https://your-host or ARTEMIS_MOBILE_URL to the HTTPS origin this app should load.')
    }
    def homeUri
    try {
        homeUri = new java.net.URI(configuredHomeUrl)
    } catch (java.net.URISyntaxException error) {
        throw new org.gradle.api.GradleException('ARTEMIS_MOBILE_URL must be a valid HTTPS origin with no path, query, or fragment.', error)
    }
    if (!homeUri.isAbsolute() || !'https'.equalsIgnoreCase(homeUri.scheme)
            || !homeUri.host || homeUri.rawUserInfo != null
            || (homeUri.rawPath && homeUri.rawPath != '/')
            || homeUri.rawQuery != null || homeUri.rawFragment != null
            || homeUri.port == 0 || homeUri.port > 65535) {
        throw new org.gradle.api.GradleException('ARTEMIS_MOBILE_URL must be an HTTPS origin (host and optional port only), without credentials, path, query, or fragment.')
    }
    configuredHomeUrl = "https://${homeUri.rawAuthority}"
    def escapedHomeUrl = configuredHomeUrl.replace('\\', '\\\\').replace('"', '\\"')
    buildFeatures { buildConfig true }
    defaultConfig.buildConfigField 'String', 'HOME_URL', '"' + escapedHomeUrl + '"'
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // WebViewCompat.addWebMessageListener: the theme bridge is origin-bound.
    implementation 'androidx.webkit:webkit:1.12.1'
    // @RequiresApi on the API 33 back-callback methods, so lint checks their SDK guards.
    implementation 'androidx.annotation:annotation:1.9.1'

    // JVM unit tests run on the host JVM, where android.net.Uri and org.json are stubs.
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
