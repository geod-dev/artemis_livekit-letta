plugins { id 'com.android.application' }

// Signing. Debug: when .signing/debug.keystore exists, debug builds are signed with it; its values
// come from local.properties, then the environment, and the build stops when one is missing.
// Without that keystore, debug builds use AGP's default debug key.
// Release: signed only with .signing/release.keystore and its artemis.release* values (or the
// ARTEMIS_RELEASE_* environment variables). A release build never uses the debug key; the release
// tasks fail with a clear message while those values are missing.
def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) localPropertiesFile.withInputStream { localProperties.load(it) }
def personalKey = rootProject.file('.signing/debug.keystore')
def signingValue = { String property, String variable ->
    def value = localProperties.getProperty(property) ?: System.getenv(variable)
    if (!value) {
        throw new org.gradle.api.GradleException(
            "Set $property in local.properties or $variable in the environment to sign with .signing/debug.keystore.")
    }
    return value
}
def releaseValue = { String property, String variable ->
    localProperties.getProperty(property) ?: System.getenv(variable)
}
def releaseKeyStore = rootProject.file(releaseValue('artemis.releaseStoreFile', 'ARTEMIS_RELEASE_STORE_FILE') ?: '.signing/release.keystore')
def releaseStorePassword = releaseValue('artemis.releaseStorePassword', 'ARTEMIS_RELEASE_STORE_PASSWORD')
def releaseKeyAlias = releaseValue('artemis.releaseKeyAlias', 'ARTEMIS_RELEASE_KEY_ALIAS')
def releaseKeyPassword = releaseValue('artemis.releaseKeyPassword', 'ARTEMIS_RELEASE_KEY_PASSWORD')
def releaseSigningMissing = !releaseKeyStore.exists() || !releaseStorePassword || !releaseKeyAlias || !releaseKeyPassword

android {
    namespace 'ai.artemis.mobile'
    compileSdk 36
    signingConfigs {
        if (personalKey.exists()) {
            debug {
                storeFile personalKey
                storePassword signingValue('artemis.debugStorePassword', 'ARTEMIS_DEBUG_STORE_PASSWORD')
                keyAlias signingValue('artemis.debugKeyAlias', 'ARTEMIS_DEBUG_KEY_ALIAS')
                keyPassword signingValue('artemis.debugKeyPassword', 'ARTEMIS_DEBUG_KEY_PASSWORD')
            }
        }
        if (!releaseSigningMissing) {
            release {
                storeFile releaseKeyStore
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }
    buildTypes {
        // Not debuggable, so adb run-as cannot read app data (including WebView session cookies).
        release {
            debuggable false
            minifyEnabled false
            if (!releaseSigningMissing) signingConfig signingConfigs.release
        }
    }
    defaultConfig {
        applicationId 'ai.artemis.mobile'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '1.0'
    }
    def configuredHomeUrl = providers.gradleProperty('artemisMobileUrl')
        .orElse(providers.environmentVariable('ARTEMIS_MOBILE_URL')).getOrNull()?.trim()
    if (!configuredHomeUrl) {
        throw new org.gradle.api.GradleException('Set -PartemisMobileUrl=https://your-host or ARTEMIS_MOBILE_URL to the HTTPS origin this app should load.')
    }
    def homeUri
    try {
        homeUri = new java.net.URI(configuredHomeUrl)
    } catch (java.net.URISyntaxException error) {
        throw new org.gradle.api.GradleException('ARTEMIS_MOBILE_URL must be a valid HTTPS origin with no path, query, or fragment.', error)
    }
    if (!homeUri.isAbsolute() || !'https'.equalsIgnoreCase(homeUri.scheme)
            || !homeUri.host || homeUri.rawUserInfo != null
            || (homeUri.rawPath && homeUri.rawPath != '/')
            || homeUri.rawQuery != null || homeUri.rawFragment != null
            || homeUri.port == 0 || homeUri.port > 65535) {
        throw new org.gradle.api.GradleException('ARTEMIS_MOBILE_URL must be an HTTPS origin (host and optional port only), without credentials, path, query, or fragment.')
    }
    configuredHomeUrl = "https://${homeUri.rawAuthority}"
    def escapedHomeUrl = configuredHomeUrl.replace('\\', '\\\\').replace('"', '\\"')
    buildFeatures { buildConfig true }
    defaultConfig.buildConfigField 'String', 'HOME_URL', '"' + escapedHomeUrl + '"'
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // WebViewCompat.addWebMessageListener: the theme bridge is origin-bound.
    implementation 'androidx.webkit:webkit:1.12.1'
    // @RequiresApi on the API 33 back-callback methods, so lint checks their SDK guards.
    implementation 'androidx.annotation:annotation:1.9.1'

    // JVM unit tests run on the host JVM, where android.net.Uri and org.json are stubs.
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}

// A release package must never be produced unsigned or with the debug key. Fail the packaging
// tasks with the missing setting named, instead of failing configuration for debug builds too.
tasks.configureEach { task ->
    if (releaseSigningMissing && task.name ==~ /(assemble|bundle|package|install)Release.*/) {
        task.doFirst {
            throw new org.gradle.api.GradleException(
                'Release signing is not configured. Create .signing/release.keystore and set artemis.releaseStorePassword, artemis.releaseKeyAlias and artemis.releaseKeyPassword in local.properties (or the ARTEMIS_RELEASE_* environment variables).')
        }
    }
}
