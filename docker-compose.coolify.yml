# Coolify deployment stack: the same services as docker-compose.yml, with fixed host paths.
# Select this one file as the application's Compose file. The differences from the base file
# are listed in deploy/coolify/README.md.
#
# Routing: set the Coolify domain to the `web` service on port 8080. Its nginx serves the app
# and proxies /api and /livekit/ to the internal services. LiveKit's signal port (7880) is not
# published; it is reached only through that proxy.
#
# Host folders (create before the first deploy; deploy/coolify/README.md has the owners and modes):
#   /data/artemis/workspace       agent workspace (agent shell uid 1002, group 1001); data/ is uid 1001, read-only to the agent
#   /data/artemis/data/gateway    gateway state only (attachment and retention records), uid 1001
name: artemis

services:
  postgres:
    # The init script is baked into the image: Coolify resolves file bind mounts on the
    # host, where the checkout does not exist, so a ./path mount becomes an empty dir.
    build:
      context: ./deploy/postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      ARTEMIS_DB_PASSWORD: ${ARTEMIS_DB_PASSWORD:?set ARTEMIS_DB_PASSWORD in .env}
      HINDSIGHT_DB_PASSWORD: ${HINDSIGHT_DB_PASSWORD:?set HINDSIGHT_DB_PASSWORD in .env}
    volumes:
      - postgres-pg18:/var/lib/postgresql   # PG18 image layout (VOLUME /var/lib/postgresql)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  hindsight:
    image: ghcr.io/vectorize-io/hindsight:1.1.0
    hostname: hindsight
    shm_size: 1g
    environment:
      HINDSIGHT_API_DATABASE_URL: postgresql://hindsight:${HINDSIGHT_DB_PASSWORD:?set HINDSIGHT_DB_PASSWORD in .env}@postgres:5432/hindsight
      HINDSIGHT_API_LLM_PROVIDER: anthropic
      HINDSIGHT_API_LLM_MODEL: ${HINDSIGHT_LLM_MODEL:-claude-haiku-5-5}
      HINDSIGHT_API_LLM_API_KEY: ${ANTHROPIC_API_KEY:?set ANTHROPIC_API_KEY in .env}
      HINDSIGHT_API_LLM_EXTRA_BODY: '{"output_config":{"effort":"medium"}}'
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import sys,urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8888/health/ready', timeout=3).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    restart: unless-stopped

  agent-server:
    build:
      context: .
      dockerfile: apps/agent-server/Dockerfile
    # Explicit list, not env_file: the server gets only the variables it reads (apps/agent-server/src/config.ts).
    # Agent shell commands run as uid 1002, so they cannot read this process's environment.
    environment:
      NODE_ENV: production
      AGENT_SERVER_PORT: 4000
      AGENT_SERVER_TOKEN: ${AGENT_SERVER_TOKEN:?set AGENT_SERVER_TOKEN in Coolify}
      DATABASE_URL: postgresql://artemis:${ARTEMIS_DB_PASSWORD:?set ARTEMIS_DB_PASSWORD in Coolify}@postgres:5432/artemis
      ARTEMIS_DB_PASSWORD: ${ARTEMIS_DB_PASSWORD:?set ARTEMIS_DB_PASSWORD in Coolify}
      HINDSIGHT_DB_PASSWORD: ${HINDSIGHT_DB_PASSWORD:?set HINDSIGHT_DB_PASSWORD in Coolify}
      HINDSIGHT_URL: http://hindsight:8888
      HINDSIGHT_API_KEY: ${HINDSIGHT_API_KEY:-}
      HINDSIGHT_BANK_ID: ${HINDSIGHT_BANK_ID:-}
      MEMORY_RETAIN_EVERY: ${MEMORY_RETAIN_EVERY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?set ANTHROPIC_API_KEY in Coolify}
      OPENAI_COMPATIBLE_BASE_URL: ${OPENAI_COMPATIBLE_BASE_URL:-}
      OPENAI_COMPATIBLE_API_KEY: ${OPENAI_COMPATIBLE_API_KEY:-}
      ASSISTANT_NAME: ${ASSISTANT_NAME:-}
      ASSISTANT_TIMEZONE: ${ASSISTANT_TIMEZONE:-}
      ASSISTANT_MODEL: ${ASSISTANT_MODEL:-}
      ASSISTANT_TASK_MODEL: ${ASSISTANT_TASK_MODEL:-}
      ASSISTANT_TITLE_MODEL: ${ASSISTANT_TITLE_MODEL:-}
      ASSISTANT_PRESENT_TOOL: ${ASSISTANT_PRESENT_TOOL:-}
      WORKER_IDLE_TIMEOUT_MS: ${WORKER_IDLE_TIMEOUT_MS:-}
      BASH_BACKGROUND_AFTER_MS: ${BASH_BACKGROUND_AFTER_MS:-}
      LOG_LEVEL: ${LOG_LEVEL:-}
      WORKSPACE_PATH: /workspace
      # Agent shell commands: uid 1002, sharing the server's group 1001 (see apps/agent-server/Dockerfile).
      WORKSPACE_RUN_AS: "1002:1001"
    depends_on:
      postgres:
        condition: service_healthy
      hindsight:
        condition: service_healthy
    volumes:
      # data/ inside this folder must be owned by uid 1001 with mode 0755 (deploy/coolify/README.md).
      - /data/artemis/workspace:/workspace
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  livekit:
    image: livekit/livekit-server:v1.13.7
    # Production leaves signal routing to the reverse proxy and publishes media
    # only. A loopback signal port remains available for the standalone HTTPS host.
    command: --bind 0.0.0.0 --node-ip ${IP_ADDRESS:?set IP_ADDRESS in .env} --udp-port 7882
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:?set LIVEKIT_API_KEY in .env}: ${LIVEKIT_API_SECRET:?set LIVEKIT_API_SECRET in .env}"
    ports:
      # WebRTC media: published on all interfaces on purpose. Signaling (7880) is not published.
      - "7881:7881"
      - "7882:7882/udp"
    restart: unless-stopped

  gateway:
    build:
      context: .
      dockerfile: apps/gateway/Dockerfile
    # Explicit list, not env_file: the gateway is the public-facing service and gets only the
    # variables it reads (apps/gateway/src/config.ts). Provider keys stay out of its environment.
    environment:
      NODE_ENV: production
      GATEWAY_PORT: 3000
      GATEWAY_HOST: 0.0.0.0
      MCP_DEVICE_BASE_URL: http://gateway:3000
      AGENT_SERVER_URL: http://agent-server:4000
      AGENT_SERVER_TOKEN: ${AGENT_SERVER_TOKEN:?set AGENT_SERVER_TOKEN in Coolify}
      ARTEMIS_PASSWORD: ${ARTEMIS_PASSWORD:?set ARTEMIS_PASSWORD in Coolify}
      ARTEMIS_DEVICE_TOKEN: ${ARTEMIS_DEVICE_TOKEN:?set ARTEMIS_DEVICE_TOKEN in Coolify}
      VOICE_GATEWAY_TOKEN: ${VOICE_GATEWAY_TOKEN:?set VOICE_GATEWAY_TOKEN in Coolify}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:?set LIVEKIT_API_KEY in Coolify}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?set LIVEKIT_API_SECRET in Coolify}
      LIVEKIT_AGENT_NAME: ${LIVEKIT_AGENT_NAME:-}
      # Browsers reach LiveKit through the web proxy (/livekit/); set LIVEKIT_PUBLIC_URL to the public wss:// URL.
      LIVEKIT_URL: ${LIVEKIT_PUBLIC_URL:-ws://${IP_ADDRESS:?set IP_ADDRESS in Coolify}:${WEB_PORT:-5180}/livekit}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      ASSISTANT_TRANSCRIPTION_MODEL: ${ASSISTANT_TRANSCRIPTION_MODEL:-}
      LOG_LEVEL: ${LOG_LEVEL:-}
      WORKSPACE_PATH: /workspace
      ARTEMIS_DATA_DIR: /data/gateway
    depends_on:
      agent-server:
        condition: service_healthy
    volumes:
      - /data/artemis/workspace:/workspace
      - /data/artemis/data/gateway:/data/gateway
    healthcheck:
      # Liveness only. /ready reports the asynchronous agent-server and MCP setup and is
      # for diagnostics; it is not a deployment gate here.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Empty means the default in apps/web/vite.config.ts.
        ASSISTANT_NAME: ${ASSISTANT_NAME:-}
    depends_on:
      gateway:
        condition: service_healthy
      # nginx resolves livekit when it proxies /livekit/; the dependency keeps the start order explicit.
      livekit:
        condition: service_started
    healthcheck:
      # Local nginx check only: /health proxies to the gateway, so it would mark web unhealthy when the gateway is down.
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/nginx-health"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  voice-agent:
    build:
      context: .
      dockerfile: apps/voice-agent/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      LIVEKIT_URL: ws://livekit:7880
      GATEWAY_URL: http://gateway:3000
    depends_on:
      gateway:
        condition: service_healthy
      livekit:
        condition: service_started
    restart: unless-stopped

networks:
  default:
    # Pinned subnet: apps/web/nginx.conf trusts this range (and loopback) for X-Forwarded-For.
    # Keep the two in sync. Also set in docker-compose.yml.
    ipam:
      config:
        - subnet: 172.29.250.0/24

volumes:
  # Same name as docker-compose.yml. Existing Coolify data stays in this volume.
  postgres-pg18:
