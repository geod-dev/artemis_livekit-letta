# Coolify deployment stack. Set the Coolify domain to the frontend service on
# port 80 and to the LiveKit service on port 7880 for WebSocket signaling.
# Persistent workspace files use the host directory previously used by Coolify.
name: artemis

services:
  postgres:
    # Init script is baked into the image: Coolify resolves file bind mounts on the
    # host, where the checkout does not exist, so a ./path mount becomes an empty dir.
    build:
      context: ./infrastructure/postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      ARTEMIS_DB_PASSWORD: ${ARTEMIS_DB_PASSWORD:?set ARTEMIS_DB_PASSWORD in .env}
      HINDSIGHT_DB_PASSWORD: ${HINDSIGHT_DB_PASSWORD:?set HINDSIGHT_DB_PASSWORD in .env}
    volumes:
      - postgres-pg18:/var/lib/postgresql   # PG18 image layout (VOLUME /var/lib/postgresql)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  hindsight:
    image: ghcr.io/vectorize-io/hindsight:1.1.0
    hostname: hindsight
    shm_size: 1g
    environment:
      HINDSIGHT_API_DATABASE_URL: postgresql://hindsight:${HINDSIGHT_DB_PASSWORD:?set HINDSIGHT_DB_PASSWORD in .env}@postgres:5432/hindsight
      HINDSIGHT_API_LLM_PROVIDER: anthropic
      HINDSIGHT_API_LLM_MODEL: claude-haiku-5-5
      HINDSIGHT_API_LLM_API_KEY: ${ANTHROPIC_API_KEY:?set ANTHROPIC_API_KEY in .env}
      HINDSIGHT_API_LLM_EXTRA_BODY: '{"output_config":{"effort":"medium"}}'
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import sys,urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8888/health/ready', timeout=3).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    restart: unless-stopped

  agent-server:
    build:
      context: .
      dockerfile: services/agent-server/Dockerfile
    env_file: .env
    environment:
      NODE_ENV: production
      AGENT_SERVER_PORT: 4000
      DATABASE_URL: postgresql://artemis:${ARTEMIS_DB_PASSWORD:?set ARTEMIS_DB_PASSWORD in .env}@postgres:5432/artemis
      HINDSIGHT_URL: http://hindsight:8888
      MCP_DEVICE_BASE_URL: http://backend:3000
      WORKSPACE_PATH: /workspace
      WORKSPACE_RUN_AS: "1001:1001"
    depends_on:
      postgres:
        condition: service_healthy
      hindsight:
        condition: service_started
    volumes:
      - /data/artemis/workspace:/workspace
      - /data/artemis/workspace/data:/workspace/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  livekit:
    image: livekit/livekit-server:v1.13.7
    # Production leaves signal routing to the reverse proxy and publishes media
    # only. A loopback signal port remains available for the standalone HTTPS host.
    command: --bind 0.0.0.0 --node-ip ${IP_ADDRESS:-127.0.0.1} --udp-port 7882
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:?set LIVEKIT_API_KEY in .env}: ${LIVEKIT_API_SECRET:?set LIVEKIT_API_SECRET in .env}"
    ports:
      - "7881:7881"
      - "7882:7882/udp"
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      NODE_ENV: production
      BACKEND_PORT: 3000
      MCP_DEVICE_BASE_URL: http://backend:3000
      AGENT_SERVER_URL: http://agent-server:4000
      LIVEKIT_URL: ${LIVEKIT_PUBLIC_URL:-ws://${IP_ADDRESS:-127.0.0.1}:7880}
      WORKSPACE_PATH: /workspace
      ASSISTANT_DATA_ROOT: /data/backend
    depends_on:
      agent-server:
        condition: service_healthy
    volumes:
      - /data/artemis/workspace:/workspace
      - /data/artemis/workspace/data:/data/backend
    healthcheck:
      # `/ready` waits for asynchronous agent-server/MCP setup. Compose uses this
      # process health check so that initialization does not block deployment.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        IP_ADDRESS: ${IP_ADDRESS:-127.0.0.1}
        ASSISTANT_NAME: ${ASSISTANT_NAME:-Artemis}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  voice-agent:
    build:
      context: .
      dockerfile: voice-agent/Dockerfile
    env_file: .env
    environment:
      LIVEKIT_URL: ws://livekit:7880
      GATEWAY_URL: http://backend:3000
    depends_on:
      backend:
        condition: service_healthy
      livekit:
        condition: service_started
    restart: unless-stopped

volumes:
  # Renamed from postgres-data: that volume was initialized before the init script
  # could run, so it has no artemis/hindsight roles. A new name forces a fresh init.
  postgres-pg18:
