name: Deploy to production

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' '185.252.233.123 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAICWPHE2gFf9q/hOaWptmFE9Vmg3s/Cb0Pyv+1024RFm9' > ~/.ssh/known_hosts

      - name: Deploy
        run: |
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes root@185.252.233.123 \
            'bash -s' <<'REMOTE'
          set -eu
          container="$(docker ps -q --filter label=com.docker.compose.project=livekit-letta | head -n 1)"
          test -n "$container"
          DEPLOY_PATH="$(docker inspect --format '{{ index .Config.Labels "com.docker.compose.project.working_dir" }}' "$container")"
          test -f "$DEPLOY_PATH/docker-compose.yml"
          cd "$DEPLOY_PATH"
          git fetch https://github.com/geod-dev/artemis_livekit-letta.git main
          git reset --hard FETCH_HEAD
          docker compose up -d --build --remove-orphans
          REMOTE
