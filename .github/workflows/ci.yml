name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: pnpm check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Postgres service below. Tests create their own tables in this database.
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      # The voice-agent and deploy groups run Python 3.13, matching apps/voice-agent/Dockerfile.
      UV_PYTHON: "3.13"
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js from .node-version
        uses: actions/setup-node@v5
        with:
          node-version-file: .node-version

      - name: Activate pnpm from packageManager
        run: |
          PNPM_VERSION=$(node -p "require('./package.json').packageManager.split('@')[1]")
          corepack enable
          corepack prepare "pnpm@${PNPM_VERSION}" --activate
          pnpm --version

      - name: Set up uv with Python 3.13
        uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run checks
        run: pnpm check

  compose:
    name: docker compose config and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Placeholders only, so Compose can interpolate required variables. CI writes no .env file.
    env:
      POSTGRES_PASSWORD: ci-placeholder
      ARTEMIS_DB_PASSWORD: ci-placeholder
      HINDSIGHT_DB_PASSWORD: ci-placeholder
      ANTHROPIC_API_KEY: ci-placeholder
      LIVEKIT_API_KEY: ci-placeholder
      LIVEKIT_API_SECRET: ci-placeholder
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Validate compose files
        run: |
          docker compose -f docker-compose.yml config -q
          docker compose -f docker-compose.yml -f docker-compose.dev.yml config -q
          docker compose -f docker-compose.coolify.yml config -q

      - name: Build images
        run: docker compose -f docker-compose.yml build gateway agent-server frontend voice-agent
