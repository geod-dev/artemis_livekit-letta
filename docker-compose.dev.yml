# Local hot-reload setup: keep Postgres, Hindsight and LiveKit in Docker, run app code on host.
# The base file makes `data` internal, and the host reaches Postgres and Hindsight through published
# 127.0.0.1 ports. This overlay makes `data` routable so those ports are published.
services:
  postgres:
    ports:
      - "127.0.0.1:5432:5432"
  hindsight:
    ports:
      - "127.0.0.1:8888:8888"

networks:
  data:
    internal: false
