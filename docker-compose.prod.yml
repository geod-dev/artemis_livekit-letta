# Production requirements layered over the shared service definition.
services:
  agent-server:
    volumes:
      - ${WORKSPACE_PATH:?set WORKSPACE_PATH in the production environment}:/workspace
      - ${ARTEMIS_DATA_DIR:?set ARTEMIS_DATA_DIR in the production environment}:/workspace/data

  gateway:
    environment:
      NODE_ENV: production
    volumes:
      - ${WORKSPACE_PATH:?set WORKSPACE_PATH in the production environment}:/workspace
      - ${ARTEMIS_DATA_DIR:?set ARTEMIS_DATA_DIR in the production environment}:/data/gateway
      - ${ARTEMIS_DATA_DIR:?set ARTEMIS_DATA_DIR in the production environment}:/workspace/data
