# Production requirements layered over the shared service definition.
services:
  agent-server:
    volumes:
      - ${WORKSPACE_PATH:?set WORKSPACE_PATH in the production environment}:/workspace
      - ${ASSISTANT_DATA_ROOT:?set ASSISTANT_DATA_ROOT in the production environment}:/workspace/data

  backend:
    environment:
      NODE_ENV: production
    volumes:
      - ${WORKSPACE_PATH:?set WORKSPACE_PATH in the production environment}:/workspace
      - ${ASSISTANT_DATA_ROOT:?set ASSISTANT_DATA_ROOT in the production environment}:/data/backend
