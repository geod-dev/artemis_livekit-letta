# One pnpm workspace and one lockfile (pnpm-lock.yaml at the root) for every
# Node package. apps/ holds the deployable entry points (agent-server, gateway,
# web) and packages/ holds the libraries they import. The workspace uses pnpm's
# default isolated linker with no public-hoist-pattern entries. Python and
# Android folders are not workspace members.
packages:
  - packages/*
  - apps/agent-server
  - apps/gateway
  - apps/web
onlyBuiltDependencies:
  - esbuild
