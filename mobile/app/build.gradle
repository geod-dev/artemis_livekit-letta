plugins { id 'com.android.application' }

android {
    namespace 'ai.artemis.mobile'
    compileSdk 35
    signingConfigs {
        debug {
            def personalKey = rootProject.file('.signing/debug.keystore')
            if (personalKey.exists()) storeFile personalKey
        }
    }
    defaultConfig {
        applicationId 'ai.artemis.mobile'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
